<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Ahmad Mohsin — Full Stack Developer Portfolio" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/images/favicon-round.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      The opening flips the monogram through other writing systems. A full
      CJK face is megabytes, which is absurd for two glyphs shown for a
      fraction of a second — so each of these is subsetted with Google's
      &text= parameter and comes back a couple of KB. The subset applies
      to the whole request, which is why they can't be folded into the
      line above. Percent-encoded: 艾姆 / アム
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&text=%E8%89%BE%E5%A7%86&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&text=%E3%82%A2%E3%83%A0&display=swap"
      rel="stylesheet"
    />
    <title>Mohsin</title>
  </head>
