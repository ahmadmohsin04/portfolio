    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      The opening flips the monogram through other writing systems. A full
      CJK face is megabytes, which is absurd for two glyphs shown for a
      fraction of a second — so each of these is subsetted with Google's
      &text= parameter and comes back a couple of KB. The subset applies
      to the whole request, which is why they can't be folded into the
      line above, and it is also why each family is requested singly.

      Three unrelated families on purpose: the Noto SC and JP faces used
      before are one typeface design with different glyph coverage, so
      the two settings read as the same specimen shown twice.
      Percent-encoded: 艾姆 / アム / 아모
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&text=%E8%89%BE%E5%A7%86&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&text=%E3%82%A2%E3%83%A0&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&text=%EC%95%84%EB%AA%A8&display=swap"
      rel="stylesheet"
    />
